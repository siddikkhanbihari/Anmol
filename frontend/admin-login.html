<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123B70">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANMOL STORE">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>Admin Portal Login — ANMOL STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--primary-navy-dark) 0%, var(--primary-navy) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .admin-login-card {
      background: #FFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      max-width: 420px;
      width: 100%;
      padding: var(--space-8);
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div style="text-align: center; margin-bottom: var(--space-6);">
      <div style="width: 56px; height: 56px; background: var(--primary-navy); color: #FFF; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto var(--space-3) auto;">
        <i class="fas fa-user-shield"></i>
      </div>
      <h2 style="font-size: var(--font-size-xl); margin-bottom: 4px;">Admin Portal</h2>
      <p style="color: var(--color-text-muted); font-size: var(--font-size-xs); margin: 0;">
        ANMOL STORE Central Management System
      </p>
    </div>

    <!-- Quick fill helper for review -->
    <div style="background: var(--color-surface-alt); border-radius: var(--radius-md); padding: var(--space-3); margin-bottom: var(--space-4); font-size: var(--font-size-xs); display: flex; justify-content: space-between; align-items: center;">
      <span>Default Seed Admin</span>
      <button type="button" id="btn-fill-admin-cred" class="btn btn-outline btn-sm" style="padding: 2px 6px; font-size: 0.7rem;">Auto Fill</button>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label required" for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" class="form-control" placeholder="admin@anmolstore.in" required>
      </div>

      <div class="form-group">
        <label class="form-label required" for="admin-password">Admin Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="Enter administrative password" required>
      </div>

      <button type="submit" id="btn-admin-submit" class="btn btn-secondary btn-block btn-lg" style="margin-top: var(--space-4);">
        Authenticate & Enter
      </button>
    </form>

    <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-xs);">
      <a href="index.html">&larr; Return to Public Marketplace</a>
    </div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { auth } from './js/auth.js';
    import { notify } from './js/notifications.js';

    document.getElementById('btn-fill-admin-cred').addEventListener('click', () => {
      document.getElementById('admin-email').value = 'admin@anmolstore.in';
      document.getElementById('admin-password').value = 'Admin@Anmol2026';
    });

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;

      const submitBtn = document.getElementById('btn-admin-submit');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      const result = await auth.login(email, password);

      if (result.success) {
        if (result.user.role !== 'admin') {
          notify.error('Access denied. Administrator privileges required.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Authenticate & Enter';
          return;
        }

        notify.success('Admin authenticated successfully');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1000);
      } else {
        notify.error(result.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Authenticate & Enter';
      }
    });
  </script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
