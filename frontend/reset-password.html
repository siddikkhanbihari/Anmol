<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123B70">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANMOL STORE">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>Reset Password — ANMOL STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header style="background: #FFF; border-bottom: 1px solid var(--color-border); padding: var(--space-4) 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-wrap"><i class="fas fa-store-alt"></i></div>
        <div class="brand-text-wrap">
          <div class="brand-title">ANMOL <span>STORE</span></div>
          <div class="brand-tagline">Local Business, Digital Future</div>
        </div>
      </a>
      <a href="login.html" class="btn btn-ghost btn-sm">Sign In</a>
    </div>
  </header>

  <div style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4);">
    <div class="card" style="background: #FFF; border: 1px solid var(--color-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); max-width: 440px; width: 100%; padding: var(--space-8);">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <h2 style="font-size: var(--font-size-xl); margin-bottom: 4px;">Set New Password</h2>
        <p style="color: var(--color-text-muted); font-size: var(--font-size-sm); margin: 0;">
          Create a secure new password for your account.
        </p>
      </div>

      <form id="reset-password-form">
        <div class="form-group">
          <label class="form-label required" for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label required" for="confirm-new-password">Confirm New Password</label>
          <input type="password" id="confirm-new-password" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--space-4);">
          Update Password & Sign In
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module">
    import { api } from './js/api.js';
    import { notify } from './js/notifications.js';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('reset-password-form');
    const submitBtn = document.getElementById('btn-reset-submit');

    if (!token) {
      notify.error('Reset token missing. Please request a new link.');
      setTimeout(() => { window.location.href = 'forgot-password.html'; }, 2000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-new-password').value;

      if (newPassword !== confirm) {
        notify.warning('Passwords do not match');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

      try {
        const res = await api.post('/auth/reset-password', { token, newPassword });
        if (res.success) {
          notify.success('Password updated successfully! Please sign in.');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        }
      } catch (err) {
        notify.error(err.message || 'Error resetting password');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Update Password & Sign In';
      }
    });
  </script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
