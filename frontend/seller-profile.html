<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123B70">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANMOL STORE">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>Shop Profile Settings — ANMOL SELLER HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .seller-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    .seller-sidebar {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      position: sticky;
      top: calc(var(--header-height) + 20px);
    }
    .seller-profile-card {
      background: #FFF;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
    }
    @media (max-width: 900px) {
      .seller-layout { grid-template-columns: 1fr; }
      .seller-sidebar { position: static; }
      .seller-profile-card { padding: var(--space-4) !important; }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container">
      <div class="header-inner">
        <a href="seller-dashboard.html" class="brand-logo">
          <div class="brand-icon-wrap" style="background: linear-gradient(135deg, var(--accent-orange) 0%, #EA580C 100%);">
            <i class="fas fa-store"></i>
          </div>
          <div class="brand-text-wrap">
            <div class="brand-title">ANMOL <span>SELLER HUB</span></div>
            <div class="brand-tagline">Shop Settings</div>
          </div>
        </a>

        <div style="display: flex; align-items: center; gap: var(--space-4); margin-left: auto;">
          <a href="seller-dashboard.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding: var(--space-8) var(--space-4);">
    <div class="seller-layout">
      <!-- Sidebar -->
      <aside class="seller-sidebar">
        <nav>
          <a href="seller-dashboard.html" class="dash-nav-item"><i class="fas fa-tachometer-alt"></i> Overview</a>
          <a href="seller-products.html" class="dash-nav-item"><i class="fas fa-boxes"></i> My Products</a>
          <a href="seller-orders.html" class="dash-nav-item"><i class="fas fa-truck-loading"></i> Customer Orders</a>
          <a href="seller-services.html" class="dash-nav-item"><i class="fas fa-tools"></i> Services & Bookings</a>
          <a href="seller-profile.html" class="dash-nav-item active"><i class="fas fa-cog"></i> Shop Settings</a>
        </nav>
      </aside>

      <!-- Main Profile Settings -->
      <section class="seller-profile-card">
        <div style="margin-bottom: var(--space-6);">
          <h1 style="font-size: var(--font-size-2xl); color: var(--primary-navy); margin: 0;">Digital Storefront Settings</h1>
          <p style="color: var(--color-text-muted); font-size: var(--font-size-sm); margin: 2px 0 0 0;">
            Update your business hours, contact numbers, delivery charges, and shop cover image.
          </p>
        </div>

        <form id="shop-settings-form">
          <div class="form-group">
            <label class="form-label required" for="cfg-shop-name">Shop Name</label>
            <input type="text" id="cfg-shop-name" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label required" for="cfg-description">Shop Description & Specialization</label>
            <textarea id="cfg-description" class="form-control" rows="3" required></textarea>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label required" for="cfg-phone">Public Contact Phone</label>
              <input type="tel" id="cfg-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="cfg-email">Contact Email</label>
              <input type="email" id="cfg-email" class="form-control">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="cfg-open-time">Opening Time</label>
              <input type="text" id="cfg-open-time" class="form-control" placeholder="e.g. 08:30 AM">
            </div>
            <div class="form-group">
              <label class="form-label" for="cfg-close-time">Closing Time</label>
              <input type="text" id="cfg-close-time" class="form-control" placeholder="e.g. 09:30 PM">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="cfg-delivery-charge">Delivery Charge (₹)</label>
              <input type="number" id="cfg-delivery-charge" class="form-control" min="0">
              <div class="form-hint">Set to 0 for free neighbourhood delivery</div>
            </div>
            <div class="form-group">
              <label class="form-label" for="cfg-min-order">Minimum Order Amount (₹)</label>
              <input type="number" id="cfg-min-order" class="form-control" min="0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Shop Cover Banner Photo</label>
            <div style="display: flex; gap: var(--space-3); align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
              <img id="preview-cover-img" src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80" style="width: 140px; height: 70px; object-fit: cover; border-radius: var(--radius-md); border: 2px solid var(--color-border);">
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="file" id="input-cover-file" accept="image/*" capture="environment" style="display: none;">
                <button type="button" id="btn-upload-cover" class="btn btn-outline btn-sm">
                  <i class="fas fa-camera"></i> 📸 Photo Kheechein / Upload
                </button>
              </div>
            </div>
            <input type="hidden" id="cfg-cover-img">
          </div>

          <div class="form-group">
            <label class="form-label">Shop Logo / Avatar Photo</label>
            <div style="display: flex; gap: var(--space-3); align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
              <img id="preview-logo-img" src="https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=200&q=80" style="width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid var(--color-border);">
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="file" id="input-logo-file" accept="image/*" capture="environment" style="display: none;">
                <button type="button" id="btn-upload-logo" class="btn btn-outline btn-sm">
                  <i class="fas fa-camera"></i> 📸 Logo Kheechein / Upload
                </button>
              </div>
            </div>
            <input type="hidden" id="cfg-logo-img">
          </div>

          <button type="submit" id="btn-save-settings" class="btn btn-primary btn-lg" style="margin-top: var(--space-4);">
            Save Storefront Changes
          </button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <div class="footer-bottom-inner">
          <div>&copy; 2026 ANMOL STORE Seller Hub.</div>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { api } from './js/api.js';
    import { auth } from './js/auth.js';
    import { notify } from './js/notifications.js';

    auth.requireAuth(['seller', 'admin']);

    let currentShop = null;

    async function loadShop() {
      try {
        const res = await api.get('/shops/mine');
        if (res.success && res.data) {
          currentShop = res.data.shop;
          document.getElementById('cfg-shop-name').value = currentShop.name || '';
          document.getElementById('cfg-description').value = currentShop.description || '';
          document.getElementById('cfg-phone').value = currentShop.contactPhone || '';
          document.getElementById('cfg-email').value = currentShop.contactEmail || '';
          document.getElementById('cfg-open-time').value = currentShop.businessHours?.open || '';
          document.getElementById('cfg-close-time').value = currentShop.businessHours?.close || '';
          document.getElementById('cfg-delivery-charge').value = currentShop.deliveryCharge || 0;
          document.getElementById('cfg-min-order').value = currentShop.minimumOrderAmount || 0;
          document.getElementById('cfg-cover-img').value = currentShop.coverImage || '';
          document.getElementById('cfg-logo-img').value = currentShop.logo || '';
          if (currentShop.coverImage) document.getElementById('preview-cover-img').src = currentShop.coverImage;
          if (currentShop.logo) document.getElementById('preview-logo-img').src = currentShop.logo;
        }
      } catch (err) {
        notify.error(err.message || 'Error loading shop data');
      }
    }

    // Full HD 1080p Image Processor for Shop Profile
    function process1080pImage(file, minTarget = 1080, maxTarget = 1920) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width < minTarget || height < minTarget) {
              if (width < height) {
                height = Math.round((height * minTarget) / width);
                width = minTarget;
              } else {
                width = Math.round((width * minTarget) / height);
                height = minTarget;
              }
            }

            if (width > maxTarget || height > maxTarget) {
              if (width > height) {
                height = Math.round((height * maxTarget) / width);
                width = maxTarget;
              } else {
                width = Math.round((width * maxTarget) / height);
                height = maxTarget;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/jpeg', 0.92);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadImageFile(file, targetHiddenId, targetPreviewId) {
      if (!file) return;
      try {
        notify.info('1080p HD Photo optimize aur upload ho rahi hai...');
        const optimizedBlob = await process1080pImage(file);
        const formData = new FormData();
        formData.append('image', optimizedBlob, 'shop-' + Date.now() + '.jpg');
        const res = await api.post('/upload', formData);
        if (res.success && res.data?.url) {
          document.getElementById(targetHiddenId).value = res.data.url;
          document.getElementById(targetPreviewId).src = res.data.url;
          notify.success('✓ 1080p HD Photo upload ho gayi!');
        }
      } catch (err) {
        // Fallback to data URL
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById(targetHiddenId).value = e.target.result;
          document.getElementById(targetPreviewId).src = e.target.result;
          notify.info('Photo save ho gayi hai.');
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('btn-upload-cover')?.addEventListener('click', () => {
      document.getElementById('input-cover-file').click();
    });
    document.getElementById('input-cover-file')?.addEventListener('change', (e) => {
      if (e.target.files?.[0]) uploadImageFile(e.target.files[0], 'cfg-cover-img', 'preview-cover-img');
    });

    document.getElementById('btn-upload-logo')?.addEventListener('click', () => {
      document.getElementById('input-logo-file').click();
    });
    document.getElementById('input-logo-file')?.addEventListener('change', (e) => {
      if (e.target.files?.[0]) uploadImageFile(e.target.files[0], 'cfg-logo-img', 'preview-logo-img');
    });

    document.getElementById('shop-settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentShop) return;

      const payload = {
        name: document.getElementById('cfg-shop-name').value.trim(),
        description: document.getElementById('cfg-description').value.trim(),
        contactPhone: document.getElementById('cfg-phone').value.trim(),
        contactEmail: document.getElementById('cfg-email').value.trim(),
        businessHours: {
          open: document.getElementById('cfg-open-time').value.trim() || '09:00 AM',
          close: document.getElementById('cfg-close-time').value.trim() || '09:00 PM'
        },
        deliveryCharge: Number(document.getElementById('cfg-delivery-charge').value || 0),
        minimumOrderAmount: Number(document.getElementById('cfg-min-order').value || 0),
        coverImage: document.getElementById('cfg-cover-img').value.trim() || undefined,
        logo: document.getElementById('cfg-logo-img').value.trim() || undefined
      };

      try {
        const res = await api.patch(`/shops/${currentShop._id}`, payload);
        if (res.success) {
          notify.success('Storefront settings updated successfully!');
          loadShop();
        }
      } catch (err) {
        notify.error(err.message || 'Failed to update settings');
      }
    });

    document.addEventListener('DOMContentLoaded', loadShop);
  </script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
